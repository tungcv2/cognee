services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    # ports:
    #   - "6333:6333"
    #   - "6334:6334"
    # environment:
    #   # Bảo vệ Qdrant bằng API key
    #   QDRANT__SERVICE__API_KEY: "${VECTOR_DB_KEY}"
    volumes:
      - ./docker-datas/qdrant_data:/qdrant/storage
    networks:
      - cognee-network

  # 2. Graph Database: Lưu trữ thực thể và mối quan hệ
  neo4j:
    image: neo4j:latest
    container_name: neo4j
    restart: unless-stopped
    ports:
      - "${NEO4J_WEB_PORT:-60911}:7474" # Giao diện Web (Neo4j Browser)
      - "${NEO4J_BOLT_PORT:-60913}:7687" # Neo4j Bolt port
    environment:
      - NEO4J_AUTH=${GRAPH_DATABASE_USERNAME:-neo4j}/${GRAPH_DATABASE_PASSWORD:-Chamchi123}
      - NEO4J_PLUGINS=["apoc"] # Hỗ trợ các thuật toán đồ thị nâng cao
    volumes:
      - ./docker-datas/neo4j_data:/data
      - ./docker-datas/neo4j_logs:/logs
    networks:
      - cognee-network

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./docker-datas/redis_data:/data
    networks:
      - cognee-network

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-60912}:5432"
    environment:
      - POSTGRES_DB=${DB_NAME:-cognee_db}
      - POSTGRES_USER=${DB_USERNAME:-cognee}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-cognee}
    volumes:
      - ./docker-datas/postgres_data:/var/lib/postgresql/data
    networks:
      - cognee-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-cognee} -d ${DB_NAME:-cognee_db}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  cognee:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cognee
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Persist Cognee system/data to writable volumes (avoid sqlite "unable to open database file").
      SYSTEM_ROOT_DIRECTORY: "/cognee_system"
      DATA_ROOT_DIRECTORY: "/cognee_data"
      # Multi-user access control can break with some DB providers; keep it off for local/dev.
      ENABLE_BACKEND_ACCESS_CONTROL: "${ENABLE_BACKEND_ACCESS_CONTROL:-false}"
      # Disable Cognee auth for local/dev (the SP-Canon API talks to Cognee server-to-server).
      REQUIRE_AUTHENTICATION: "false"
      REQUIRE_AUTH: "false"
    depends_on:
      qdrant:
        condition: service_started
      neo4j:
        condition: service_started
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "exit 0" ]
      start_period: 60s
    ports:
      - "${COGNEE_API_PORT:-60910}:8000"
    volumes:
      - ./docker-datas/cognee_system:/cognee_system
      - ./docker-datas/cognee_data:/cognee_data
    command: >
      uvicorn cognee.api.client:app --host 0.0.0.0 --port 8000
    networks:
      - cognee-network

networks:
  cognee-network:
    driver: bridge
